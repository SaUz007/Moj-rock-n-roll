<script>
function handleSearch(event) {
    event.preventDefault();

    let query = document
        .getElementById("searchInput")
        .value
        .toLowerCase()
        .trim();

    query = query
	.replace(/đ/g, "dj")
    .replace(/č/g, "c")
    .replace(/ć/g, "c")
    .replace(/š/g, "s")
    .replace(/ž/g, "z")
    .replace(/[^a-z0-9]/g, ""); 	

    const pages = {
            "acdc": "../rock/acdc/acdc.html",
    "rollingstones": "../rock/rollingStones/rollingStones.html",
    "thebeatles": "../rock/beatles/beatles.html",
    "elvispresley": "../rock/elvis/elvis.html",
    "jimihendrix": "../rock/jimihendrix/jimihendrix.html",
    "queen": "../rock/queen/queen.html",
    "ledzeppelin": "../rock/ledZeppelin/ledZeppelin.html",
    "pinkfloyd": "../rock/pinkFloyd/pinkFloyd.html",
    "thedoors": "../rock/doors/doors.html",
    "direstraits": "../rock/direStraits/direStraits.html",
	
    "metallica": "../metal/metallica/metallica.html",
    "slayer": "../metal/slayer/slayer.html",
    "anthrax": "../metal/anthrax/anthrax.html",
    "megadeath": "../metal/megadeath/megadeath.html",
    "pantera": "../metal/pantera/pantera.html",
    "blacksabbath": "../metal/blackSabbath/blackSabbath.html",
    "ironmaiden": "../metal/ironMaiden/ironMaiden.html",
    "judaspriest": "../metal/judasPriest/judasPriest.html",
    "ozzyosbourne": "../metal/ozzy/ozzy.html",
    "motorhead": "../metal/motorhead/motorhead.html",
	
    "bijelodugme": "../yugo/dugme/dugme.html",
    "ribljacorba": "../yugo/čorba/čorba.html",
    "parnivaljak": "../yugo/parniValjak/parniValjak.html",
    "crvenajabuka": "../yugo/jabuka/jabuka.html",
    "divljejagode": "../yugo/jagode/jagode.html",
    "prljavokazaliste": "../yugo/prljavoKazalište/prljavoKazalište.html",
    "plaviorkestar": "../yugo/plaviOrkestar/plaviOrkestar.html",
    "zabranjenopusenje": "../yugo/zabranjenoPušenje/zabranjenoPušenje.html",
    "djordjebalasevic": "../yugo/đole/đole.html",
    "bajagaiinstruktori": "../yugo/bajaga/bajaga.html"
    };

    if (pages[query]) {
        window.location.href = pages[query];
    } else {
        alert("Page not found");
    }
}
